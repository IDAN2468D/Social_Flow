# ==============================================================================
# SocialFlow — Render Blueprint (Infrastructure as Code)
# Deploy all 8 microservices + Managed PostgreSQL in one click:
# https://render.com/deploy?repo=https://github.com/IDAN2468D/Social_Flow
# ==============================================================================

databases:
  - name: socialflow-postgres
    databaseName: socialflow_db
    user: socialflow
    plan: free

envVarGroups:
  - name: socialflow-shared-env
    envVars:
      # Cap HikariCP pool per service for Render Free PostgreSQL connection limits
      - key: DB_POOL_SIZE
        value: "2"

      # Auto-generated cryptographically secure JWT secret shared across all services
      - key: JWT_SECRET
        generateValue: true

      # Gemini API (enter in Render Dashboard during Blueprint setup)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

      # Kafka enabled via socialflow-kafka Private Service (flip to "false" if deploying without pserv)
      - key: KAFKA_AUTO_STARTUP
        value: "true"

      # External S3 / Cloudflare R2 / MinIO Object Storage for Media Service
      - key: AWS_S3_ENDPOINT
        sync: false
      - key: AWS_S3_PUBLIC_ENDPOINT
        sync: false
      - key: AWS_S3_BUCKET
        value: socialflow-media
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

services:
  # 1. Spring Cloud API Gateway (Public Entry Point)
  - type: web
    name: socialflow-api-gateway
    runtime: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: ./api-gateway
    plan: free
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: socialflow-shared-env
      - key: USER_SERVICE_HOSTPORT
        fromService:
          type: web
          name: socialflow-user-service
          property: hostport
      - key: USER_SERVICE_HOST
        fromService:
          type: web
          name: socialflow-user-service
          property: host
      - key: POST_SERVICE_HOSTPORT
        fromService:
          type: web
          name: socialflow-post-service
          property: hostport
      - key: POST_SERVICE_HOST
        fromService:
          type: web
          name: socialflow-post-service
          property: host
      - key: FEED_SERVICE_HOSTPORT
        fromService:
          type: web
          name: socialflow-feed-service
          property: hostport
      - key: FEED_SERVICE_HOST
        fromService:
          type: web
          name: socialflow-feed-service
          property: host
      - key: MEDIA_SERVICE_HOSTPORT
        fromService:
          type: web
          name: socialflow-media-service
          property: hostport
      - key: MEDIA_SERVICE_HOST
        fromService:
          type: web
          name: socialflow-media-service
          property: host
      - key: NOTIFICATION_SERVICE_HOSTPORT
        fromService:
          type: web
          name: socialflow-notification-service
          property: hostport
      - key: NOTIFICATION_SERVICE_HOST
        fromService:
          type: web
          name: socialflow-notification-service
          property: host
      - key: AI_SERVICE_HOSTPORT
        fromService:
          type: web
          name: socialflow-ai-service
          property: hostport
      - key: AI_SERVICE_HOST
        fromService:
          type: web
          name: socialflow-ai-service
          property: host

  # 3. User & Auth Service (Spring Boot 3)
  - type: web
    name: socialflow-user-service
    runtime: docker
    dockerfilePath: ./user-service/Dockerfile
    dockerContext: ./user-service
    plan: free
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: socialflow-shared-env
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        fromService:
          type: pserv
          name: socialflow-kafka
          property: hostport
      - key: DB_HOST
        fromDatabase:
          name: socialflow-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: socialflow-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: socialflow-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: socialflow-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: socialflow-postgres
          property: password

  # 4. Post, Poll & Reactions Service (Spring Boot 3)
  - type: web
    name: socialflow-post-service
    runtime: docker
    dockerfilePath: ./post-service/Dockerfile
    dockerContext: ./post-service
    plan: free
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: socialflow-shared-env
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        fromService:
          type: pserv
          name: socialflow-kafka
          property: hostport
      - key: DB_HOST
        fromDatabase:
          name: socialflow-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: socialflow-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: socialflow-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: socialflow-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: socialflow-postgres
          property: password

  # 5. Feed & Elasticsearch Search Service (Spring Boot 3)
  - type: web
    name: socialflow-feed-service
    runtime: docker
    dockerfilePath: ./feed-service/Dockerfile
    dockerContext: ./feed-service
    plan: free
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: socialflow-shared-env
      - key: SPRING_ELASTICSEARCH_HOSTPORT
        fromService:
          type: pserv
          name: socialflow-elasticsearch
          property: hostport
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        fromService:
          type: pserv
          name: socialflow-kafka
          property: hostport
      - key: DB_HOST
        fromDatabase:
          name: socialflow-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: socialflow-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: socialflow-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: socialflow-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: socialflow-postgres
          property: password

  # 6. Media & S3 / MinIO Presigned URL Service (Spring Boot 3)
  - type: web
    name: socialflow-media-service
    runtime: docker
    dockerfilePath: ./media-service/Dockerfile
    dockerContext: ./media-service
    plan: free
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: socialflow-shared-env

  # 7. Real-Time Notifications & WebSocket STOMP Service (Spring Boot 3)
  - type: web
    name: socialflow-notification-service
    runtime: docker
    dockerfilePath: ./notification-service/Dockerfile
    dockerContext: ./notification-service
    plan: free
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: socialflow-shared-env
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        fromService:
          type: pserv
          name: socialflow-kafka
          property: hostport
      - key: DB_HOST
        fromDatabase:
          name: socialflow-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: socialflow-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: socialflow-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: socialflow-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: socialflow-postgres
          property: password

  # 8. AI Agent (LangGraph) & RAG Service (FastAPI)
  - type: web
    name: socialflow-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - fromGroup: socialflow-shared-env
      - key: KAFKA_BOOTSTRAP_SERVERS
        fromService:
          type: pserv
          name: socialflow-kafka
          property: hostport
      - key: FEED_SERVICE_HOSTPORT
        fromService:
          type: web
          name: socialflow-feed-service
          property: hostport

  # 9. Apache Kafka Broker (KRaft Single-Node Private Service — requires paid plan on Render)
  - type: pserv
    name: socialflow-kafka
    runtime: docker
    dockerfilePath: ./kafka/Dockerfile
    dockerContext: ./kafka
    plan: starter
    autoDeploy: true
    envVars:
      - key: PORT
        value: "9092"

  # 10. Kafka UI (Visual Event & Topic Explorer)
  - type: web
    name: socialflow-kafka-ui
    runtime: docker
    dockerfilePath: ./kafka-ui/Dockerfile
    dockerContext: ./kafka-ui
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: KAFKA_CLUSTERS_0_NAME
        value: socialflow-cluster
      - key: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
        fromService:
          type: pserv
          name: socialflow-kafka
          property: hostport

  # 11. Elasticsearch 8 (Single-Node Private Service — requires paid plan on Render)
  - type: pserv
    name: socialflow-elasticsearch
    runtime: docker
    dockerfilePath: ./elasticsearch/Dockerfile
    dockerContext: ./elasticsearch
    plan: standard
    autoDeploy: true
    envVars:
      - key: PORT
        value: "9200"
