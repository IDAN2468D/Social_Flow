<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialFlow — יצירת חשבון חדש</title>
  <meta name="description" content="הרשמה לרשת החברתית SocialFlow מבוססת Microservices">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- Background Glow Orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="auth-page-wrapper">
    <div class="auth-container">
      
      <!-- Brand Logo & Header -->
      <div class="auth-brand-header">
        <a href="index.html" class="auth-brand-logo" title="חזרה לדף הבית">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </a>
        <h1 class="auth-brand-title">Social<span class="brand-accent">Flow</span></h1>
        <span class="brand-badge">הרשמה מהירה ✨</span>
      </div>

      <!-- Main Register Card -->
      <div class="card glass-card auth-card">
        <h2 class="auth-card-title">הצטרף ל-SocialFlow 🚀</h2>
        <p class="auth-card-subtitle">צור חשבון חדש בחינם והתחל לשתף רגעים, סקרים ומדיה עם העולם.</p>

        <!-- Dynamic Live Avatar Preview -->
        <div class="auth-avatar-preview-box">
          <div class="auth-avatar-circle">
            <img id="live-reg-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=newuser" alt="תצוגה מקדימה של אווטאר">
          </div>
          <span class="auth-avatar-hint">האווטאר שלך נוצר אוטומטית לפי שם המשתמש</span>
        </div>

        <!-- Feedback Alert -->
        <div id="auth-alert" class="auth-alert-box hidden"></div>

        <!-- Register Form -->
        <form id="register-page-form">
          <div class="form-group">
            <label for="reg-username">שם משתמש *</label>
            <input type="text" id="reg-username" class="form-input" placeholder="למשל: noa_cohen (אותיות ומספרים)" autocomplete="username" required autofocus>
          </div>

          <div class="form-group">
            <label for="reg-fullname">שם מלא</label>
            <input type="text" id="reg-fullname" class="form-input" placeholder="למשל: נועה כהן" autocomplete="name">
          </div>

          <div class="form-group">
            <label for="reg-email">כתובת דוא״ל *</label>
            <input type="email" id="reg-email" class="form-input" placeholder="name@example.com" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="reg-password">סיסמה *</label>
            <div class="password-input-group">
              <input type="password" id="reg-password" class="form-input" placeholder="לפחות 6 תווים" autocomplete="new-password" required minlength="6">
              <button type="button" id="btn-toggle-pass" class="btn-toggle-password" title="הצג/הסתר סיסמה">👁️</button>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-confirm-password">אימות סיסמה *</label>
            <input type="password" id="reg-confirm-password" class="form-input" placeholder="הזן את הסיסמה בשנית" autocomplete="new-password" required minlength="6">
          </div>

          <button type="submit" id="btn-submit-reg" class="btn btn-primary btn-full mt-3">
            <span class="btn-text">צור חשבון והתחבר</span>
            <span id="reg-spinner" class="spinner-sm hidden" style="margin-right: 8px;"></span>
          </button>
        </form>

        <!-- Switch to Login -->
        <div class="auth-switch-prompt">
          <span>כבר יש לך חשבון?</span>
          <a href="login.html">התחבר כאן 🔐</a>
        </div>
      </div>

      <!-- Back to Feed link -->
      <div class="auth-back-nav">
        <a href="index.html">← המשך כצופה אורח לפיד הראשי</a>
      </div>

    </div>
  </div>

  <script>
    // Configuration
    const isDocker = window.location.port === '3000' || window.location.port === '80';
    const API_BASE = isDocker ? '' : 'http://localhost:8088';

    const alertBox = document.getElementById('auth-alert');
    const form = document.getElementById('register-page-form');
    const submitBtn = document.getElementById('btn-submit-reg');
    const btnText = submitBtn.querySelector('.btn-text');
    const spinner = document.getElementById('reg-spinner');
    const passInput = document.getElementById('reg-password');
    const confirmPassInput = document.getElementById('reg-confirm-password');
    const togglePassBtn = document.getElementById('btn-toggle-pass');
    const usernameInput = document.getElementById('reg-username');
    const avatarImg = document.getElementById('live-reg-avatar');

    // Live avatar preview based on username
    let avatarTimer = null;
    usernameInput.addEventListener('input', () => {
      clearTimeout(avatarTimer);
      avatarTimer = setTimeout(() => {
        const seed = usernameInput.value.trim() || 'newuser';
        avatarImg.src = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(seed)}`;
      }, 250);
    });

    // Toggle password visibility
    togglePassBtn?.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      confirmPassInput.type = isPass ? 'text' : 'password';
      togglePassBtn.textContent = isPass ? '🙈' : '👁️';
    });

    function showAlert(msg, isSuccess = false) {
      alertBox.textContent = msg;
      alertBox.className = `auth-alert-box ${isSuccess ? 'auth-alert-success' : 'auth-alert-error'}`;
      alertBox.classList.remove('hidden');
    }

    // Submit registration
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');

      const username = usernameInput.value.trim();
      const fullName = document.getElementById('reg-fullname').value.trim() || username;
      const email = document.getElementById('reg-email').value.trim();
      const password = passInput.value;
      const confirmPassword = confirmPassInput.value;

      if (!username || !email || !password) {
        showAlert('נא למלא את כל שדות החובה המסומנים בכוכבית (*)');
        return;
      }

      if (password.length < 6) {
        showAlert('הסיסמה חייבת להכיל לפחות 6 תווים');
        passInput.focus();
        return;
      }

      if (password !== confirmPassword) {
        showAlert('הסיסמאות שהזנת אינן תואמות');
        confirmPassInput.focus();
        return;
      }

      try {
        submitBtn.disabled = true;
        btnText.textContent = 'יוצר חשבון...';
        spinner.classList.remove('hidden');

        const res = await fetch(`${API_BASE}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username,
            fullName,
            email,
            password
          })
        });

        if (!res.ok) {
          const errText = await res.text();
          let parsedMsg = '';
          try {
            const errJson = JSON.parse(errText);
            parsedMsg = errJson.message || errJson.error;
          } catch (_) {
            parsedMsg = errText;
          }
          if (res.status === 409 || parsedMsg.includes('exists')) {
            throw new Error('שם המשתמש או כתובת הדוא״ל כבר תפוסים במערכת');
          }
          throw new Error(parsedMsg || `שגיאה בהרשמה (${res.status})`);
        }

        const data = await res.json();

        // Save authenticated user state in localStorage
        const userObj = {
          userId: data.userId || 1,
          username: data.username || username,
          fullName: data.fullName || fullName,
          email: data.email || email,
          token: data.token || ''
        };
        localStorage.setItem('socialflow_user', JSON.stringify(userObj));

        showAlert('החשבון נוצר בהצלחה! מעביר לפיד...', true);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);

      } catch (err) {
        console.error('Registration error:', err);
        showAlert(err.message || 'אירעה שגיאה בעת ההרשמה. אנא נסה שוב.');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'צור חשבון והתחבר';
        spinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
