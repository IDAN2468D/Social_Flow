name: SocialFlow CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: socialflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests Across All Microservices
        run: |
          find ~/.m2/repository -name "_remote.repositories" -delete || true
          mvn -B -nsu test || (sleep 10 && mvn -B -nsu test)

      - name: Set up Python 3.11 & Run AI Service Tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI Service Dependencies & Run Pytest
        run: |
          pip install -r ai-service/requirements.txt pytest
          python -m pytest ai-service/tests/test_agent.py

      - name: Verify Docker Compose Configuration
        run: docker compose config -q
