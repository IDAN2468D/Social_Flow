x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"
    compress: "true"

services:
  # =========================================================================
  # 1. תשתית נתונים, הודעות ואחסון (Infrastructure — מותאם לצריכת RAM נמוכה)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: socialflow-postgres
    profiles: ["infra", "backend", "all"]
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: socialflow_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - socialflow-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: socialflow-kafka
    profiles: ["kafka", "infra", "backend", "all"]
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    ports:
      - "9095:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9095'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 52428800
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_CLEANUP_POLICY: 'delete'
      KAFKA_HEAP_OPTS: '-Xms256m -Xmx320m'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - socialflow-net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: socialflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      for topic in post-events user-events feed-events reaction-events ai-enrichment-events; do
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1
      done
      echo 'All Kafka topics initialized!'
      "
    networks:
      - socialflow-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: socialflow-kafka-ui
    profiles: ["kafka", "infra", "backend", "all"]
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: socialflow-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
      JAVA_OPTS: '-XX:+UseSerialGC -Xms64m -Xmx160m'
    depends_on:
      - kafka
    networks:
      - socialflow-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: socialflow-elasticsearch
    profiles: ["infra", "backend", "all"]
    restart: unless-stopped
    mem_limit: 640m
    logging: *default-logging
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9205:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - socialflow-net

  minio:
    image: minio/minio:latest
    container_name: socialflow-minio
    profiles: ["infra", "backend", "all"]
    restart: always
    user: root
    mem_limit: 256m
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"   # S3 API Port
      - "9001:9001"   # MinIO Web Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - socialflow-net

  # =========================================================================
  # 2. מיקרו-סרוויסים (Java Spring Boot 3 Backend Microservices)
  # =========================================================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: socialflow-user-service
    profiles: ["backend", "all"]
    restart: unless-stopped
    mem_limit: 288m
    logging: *default-logging
    ports:
      - "8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xms64m -Xmx160m -XX:MaxMetaspaceSize=96m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/socialflow_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - socialflow-net

  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    container_name: socialflow-post-service
    profiles: ["backend", "all"]
    restart: unless-stopped
    mem_limit: 288m
    logging: *default-logging
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xms64m -Xmx160m -XX:MaxMetaspaceSize=96m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/post_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - socialflow-net

  feed-service:
    build:
      context: ./feed-service
      dockerfile: Dockerfile
    container_name: socialflow-feed-service
    profiles: ["backend", "all"]
    restart: unless-stopped
    mem_limit: 288m
    logging: *default-logging
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xms64m -Xmx160m -XX:MaxMetaspaceSize=96m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/feed_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks:
      - socialflow-net

  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile
    container_name: socialflow-media-service
    profiles: ["backend", "all"]
    restart: on-failure
    mem_limit: 288m
    logging: *default-logging
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xms64m -Xmx160m -XX:MaxMetaspaceSize=96m"
      SERVER_PORT: 8084
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PUBLIC_ENDPOINT: http://localhost:9000
      AWS_S3_BUCKET: socialflow-media
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      - minio
      - kafka
    networks:
      - socialflow-net

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: socialflow-notification-service
    profiles: ["backend", "all"]
    restart: unless-stopped
    mem_limit: 288m
    logging: *default-logging
    ports:
      - "8085:8085"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xms64m -Xmx160m -XX:MaxMetaspaceSize=96m"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - socialflow-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: socialflow-api-gateway
    profiles: ["backend", "all"]
    restart: unless-stopped
    mem_limit: 288m
    logging: *default-logging
    ports:
      - "8088:8088"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xms64m -Xmx160m -XX:MaxMetaspaceSize=96m"
      USER_SERVICE_URI: http://user-service:8081
      POST_SERVICE_URI: http://post-service:8082
      FEED_SERVICE_URI: http://feed-service:8083
      MEDIA_SERVICE_URI: http://media-service:8084
      NOTIFICATION_SERVICE_URI: http://notification-service:8085
      NOTIFICATION_SERVICE_WS_URI: ws://notification-service:8085
      AI_SERVICE_URI: http://ai-service:8086
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      - user-service
      - post-service
      - feed-service
      - media-service
      - notification-service
    networks:
      - socialflow-net

  # =========================================================================
  # 3. שירות בינה מלאכותית (AI Microservice — אופציונלי עם --profile ai / all)
  # =========================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: socialflow-ai-service
    profiles: ["ai", "all"]
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    ports:
      - "8086:8086"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-3.5-flash-lite
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      API_GATEWAY_URL: http://api-gateway:8088
      FEED_SERVICE_URI: http://feed-service:8083
      POST_SERVICE_URI: http://post-service:8082
    depends_on:
      - kafka
    networks:
      - socialflow-net

# =========================================================================
# אחסון ורשתות (Volumes & Networks)
# =========================================================================
volumes:
  postgres_data:
  es_data:
  minio_data:
  elasticsearch_data:
  kafka_data:

networks:
  socialflow-net:
    driver: bridge
